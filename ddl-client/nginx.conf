server {
    server_name cisto-tyt.ru;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'none';" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        font/ttf
        font/otf;

    root /var/www/ddl-co-nuxt/ddl-client/dist;
    index index.html;

    # Charset and MIME types
    charset utf-8;
    charset_types text/css text/javascript text/plain text/xml application/json application/javascript application/xml+rss application/atom+xml;

    # Handle robots.txt and sitemap.xml
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type text/plain;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type application/xml;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Handle favicon and manifest files
    location = /favicon.ico {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type image/x-icon;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/manifest+json;
    }

    # Main SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cisto-tyt.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cisto-tyt.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name cisto-tyt.ru www.cisto-tyt.ru;

    return 301 https://cisto-tyt.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.cisto-tyt.ru;

    return 301 https://cisto-tyt.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/cisto-tyt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cisto-tyt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
